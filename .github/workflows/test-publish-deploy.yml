name: Test, publish, deploy

on:
  workflow_dispatch:
  push:
    branches: [ "develop", "haproxy" ]
  pull_request:
    branches: [ "develop" ]

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-publish-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Build package
      run: |
        python -m build
    - name: Test with pytest
      run: |
        pip install pytest-cov

    - name: Debug secrets
      shell: bash
      run: echo "$SECRETS_CONTEXT"
      env:
        SECRETS_CONTEXT: ${{ toJson(secrets) }}
    - name: Define registry host, image name & version
      run: echo "IMAGE=planckproxy:$(date +%Y%m%d-%H%M)-${{ github.ref_name }}-${{ github.run_number }}" >> $GITHUB_ENV
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to dockerreg.planck.security
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.PLANCK_DOCKER_REGISTRY_HOST }}
        username: ${{ secrets.PLANCK_DOCKER_REGISTRY_USER }}
        password: ${{ secrets.PLANCK_DOCKER_REGISTRY_PASSWORD }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          GH_USER=${{ secrets.ALL_REPO_ACCESS_USER }}
          GH_TOKEN=${{ secrets.ALL_REPO_ACCESS_TOKEN }}
        tags: |
          ${{ secrets.PLANCK_DOCKER_REGISTRY_HOST }}/${{ env.IMAGE }}
          ${{ secrets.PLANCK_DOCKER_REGISTRY_HOST }}/planckproxy:latest
        cache-from: type=registry,ref=${{ secrets.PLANCK_DOCKER_REGISTRY_HOST }}/planckproxy:buildcache
        cache-to: type=registry,ref=${{ secrets.PLANCK_DOCKER_REGISTRY_HOST }}/planckproxy:buildcache,mode=max

    - name: Deploy on O365proxy.planck.dev
      env:
        SSH_KEY: ${{ secrets.PLANCK_SSH_KEY }}
      shell: bash
      run: |
        echo "${SSH_KEY} >> ~/ssh.key"
        chmod 400 ~/ssh.key
        ssh -o StrictHostKeychecking=no -i ~/ssh.key root@80.90.47.3 -p 24122 "hostname -f"
        echo "TODO: docker pull + compose ${{ env.IMAGE }}"
